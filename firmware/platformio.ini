; HIL runner firmware. Builds against the library checkout under test, whose
; path comes from $HIL_LIB_DIR (builder/build.sh and conftest.py export it from
; hil_config.toml's rig.lib_dir; it defaults to ~/src/ESP32-BLE-Gamepad when
; unset). run.sh / build.sh keep that checkout on the ref being tested. One env
; per board x profile; the profile picks the HID descriptor (and thus a
; distinct host bond).

[platformio]
default_envs = esp32dev

[env]
; Pinned to the pioarduino release 55.03.312-1 (Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5), by commit as tags can move.
; A release, not a develop commit: its platform.json fetches the 3.3.12 core + libs tarballs, where a develop commit
; (e.g. the observer's d41d838) fetches arduino-esp32 master.zip -- fine for the observer (framework = espidf, IDF
; tarball pinned), not for an Arduino build. Unpinned, `espressif32` resolved differently everywhere: a fresh CI
; install got the official platform (881 KB images, 92% of a multi-slot slot), CI's ~/.platformio cache (keyed on
; this file) had kept Arduino 2.0.17 for weeks. The pin is part of this file, so it also moves the CI cache key.
platform = https://github.com/pioarduino/platform-espressif32.git#2959e98a2750832bca32fd2f849c0c274a4cdd63
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
    symlink://${sysenv.HIL_LIB_DIR}
build_flags =
    -D BLE_GAMEPAD_DEBUG=0

; Activity LED (-D HIL_LED_PIN=<gpio>, opt-in, see hil_runner.cpp) is injected
; per board at build time, not hardcoded here -- see hil_config.toml
; [board.*].led_pin / $HIL_LED_PIN_<BOARD> and README "Rig hardware TODO".

[esp32dev_board]
board = esp32dev
; Pinned copies of Arduino's defaults (firmware/partitions/README.md); multi-slot boards use multislot.csv instead.
board_build.partitions = partitions/runner-dual-ota-4mb.csv
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32dev\"

[esp32c3_board]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/runner-dual-ota-4mb.csv
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32c3\"
# Native USB-Serial/JTAG flashing drops packets at the default 460800
# ("Packet content transfer stopped"); 115200 is slower but reliable.
upload_speed = 115200

[esp32s3_board]
# esp32-s3-devkitc-1 = the common dual-USB-C S3 board: a "USB" port (native
# USB-OTG, flash_port) and a "UART" port (onboard CP2102 bridge, port) -- no
# external wiring needed, unlike the C3. See README "ESP32-S3 dual-USB-C".
board = esp32-s3-devkitc-1
board_build.partitions = partitions/runner-dual-ota-8mb.csv
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32s3\"
# Native USB flashing is flaky above this, same as the C3 -- see tester/flash.py
# SLOW_CHIPS.
upload_speed = 115200

[env:esp32dev]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32c3]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32s3]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32dev-specials]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SPECIALS

[env:esp32c3-specials]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SPECIALS

[env:esp32s3-specials]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SPECIALS

[env:esp32dev-minimal]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MINIMAL

[env:esp32c3-minimal]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MINIMAL

[env:esp32s3-minimal]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MINIMAL

[env:esp32dev-maxbtn]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXBTN

[env:esp32c3-maxbtn]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXBTN

[env:esp32s3-maxbtn]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXBTN

# `maxfeat` -- max features rather than max buttons: everything Bluepad32's
# generic HID parser maps (16 btn, hat, 6 axes, accelerator+brake, home+back).
[env:esp32dev-maxfeat]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXFEAT

[env:esp32c3-maxfeat]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXFEAT

[env:esp32s3-maxfeat]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXFEAT

# `sinput` -- GamepadMode::SInput (SInput VID/PID and report layout, IMU + RGB
# on) for SInput-aware observers: SDL3 with the SInput hint, or Bluepad32.
[env:esp32dev-sinput]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SINPUT

[env:esp32c3-sinput]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SINPUT

[env:esp32s3-sinput]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SINPUT

# `local` -- ad-hoc developer profile, NOT built by CI or a release. Advertises
# as "HILdev <board>" (hil_profile.h HIL_DEVICE_NAME) so a dev board doesn't
# clash with the rig. Override the name (<= 18 chars) per box:
#   HIL_DEVICE_NAME="HILdev clt" builder/build.sh --profiles local
#   builder/build.sh --profiles local --name "HILdev clt"
#   PLATFORMIO_BUILD_FLAGS='-DHIL_DEVICE_NAME=\"HILdev clt\"' pio run -e esp32dev-local
[env:esp32dev-local]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_LOCAL

[env:esp32c3-local]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_LOCAL

[env:esp32s3-local]
extends = esp32s3_board
build_flags = ${esp32s3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_LOCAL

; esp32dev2 -- a second classic ESP32 DevKit (onboard CP2102), the board the
; rig's esp32dev replaced on 2026-09-10. Same chip and pio board as esp32dev;
; its own name so it advertises "HILpad esp32dev2" and gets its own bundles.
; In the observer matrix (tester/test-matrix.sh), not in CI's board lists.
[esp32dev2_board]
board = esp32dev
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32dev2\"

[env:esp32dev2]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32dev2-specials]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SPECIALS

[env:esp32dev2-minimal]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MINIMAL

[env:esp32dev2-maxbtn]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXBTN

[env:esp32dev2-maxfeat]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_MAXFEAT

[env:esp32dev2-sinput]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SINPUT

[env:esp32dev2-local]
extends = esp32dev2_board
build_flags = ${esp32dev2_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_LOCAL
