; HIL runner firmware. Builds against the library checkout under test at
; /home/leet/src/ESP32-BLE-Gamepad (the one hard-coded path this rig assumes;
; run.sh / conftest.py keep that checkout on the ref being tested). One env per
; board; "-signed" variants build the signed-axes profile (distinct HID
; descriptor -> distinct host bond).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
    symlink:///home/leet/src/ESP32-BLE-Gamepad
build_flags =
    -D BLE_GAMEPAD_DEBUG=0

[esp32dev_board]
board = esp32dev
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32dev\"

[esp32c3_board]
board = esp32-c3-devkitc-02
build_flags = ${env.build_flags} -D HIL_BOARD_NAME=\"esp32c3\"

[env:esp32dev]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32c3]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_DEFAULT

[env:esp32dev-signed]
extends = esp32dev_board
build_flags = ${esp32dev_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SIGNED_AXES

[env:esp32c3-signed]
extends = esp32c3_board
build_flags = ${esp32c3_board.build_flags} -D HIL_PROFILE=HIL_PROFILE_SIGNED_AXES
