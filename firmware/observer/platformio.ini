; Bluepad32 observer: Bluepad32 (with the SInput parser) as a BLE central, printing what it parses as `HIL ...` lines
; on the serial console for tester/bp32_hil.py. Built by builder/build-observers.sh, which points HIL_BLUEPAD32_DIR at
; the Bluepad32 checkout ([observer].bluepad32_dir).
[platformio]
src_dir = main
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = partitions.csv

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
