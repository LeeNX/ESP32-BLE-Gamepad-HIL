# Build hil_runner firmware on a runner, then flash + run the BLE HID suite on
# the Raspberry Pi tester over SSH.
#
# Runs on push, on manual dispatch, and on repository_dispatch (so the library
# repo can trigger it). `lib_ref` selects the ESP32-BLE-Gamepad ref under test.
#
# Required repo secrets:
#   HIL_TESTER_HOST      hostname / IP of the tester (a Tailscale name works)
#   HIL_TESTER_USER      ssh user on the tester
#   HIL_TESTER_SSH_KEY   private key authorised on the tester (no passphrase)
#
# The tester has this repo checked out at ~/ESP32-BLE-Gamepad-HIL with
# hil_config.local.toml filled in (board ports), its ~/.venvs/hil built from
# tester/requirements.txt, the udev rule, the ESP32(s) + a BLE adapter. It only
# ever flashes prebuilt bundles -- no PlatformIO on the tester.

name: HIL

on:
  push:
    branches: [main, "hil-*"]
  workflow_dispatch:
    inputs:
      lib_repo:
        description: ESP32-BLE-Gamepad git URL
        default: https://github.com/LeeNX/ESP32-BLE-Gamepad.git
      lib_ref:
        description: library ref to test
        default: master
  repository_dispatch:
    types: [hil]

concurrency:
  group: hil-rig          # one physical rig -- never run two at once
  cancel-in-progress: false

env:
  LIB_REPO: ${{ inputs.lib_repo || github.event.client_payload.lib_repo || 'https://github.com/LeeNX/ESP32-BLE-Gamepad.git' }}
  LIB_REF:  ${{ inputs.lib_ref  || github.event.client_payload.lib_ref  || 'master' }}
  BOARDS: esp32dev
  PROFILES: default signed-axes specials minimal maxbtn reports

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout library under test
        run: |
          git clone --depth 1 --branch "$LIB_REF" "$LIB_REPO" "$HOME/ci-lib" \
            || git clone "$LIB_REPO" "$HOME/ci-lib"
          git -C "$HOME/ci-lib" checkout "$LIB_REF"
          git -C "$HOME/ci-lib" rev-parse --short HEAD

      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/ci-pio"
          "$HOME/ci-pio/bin/pip" -q install platformio

      - name: Build firmware bundles
        run: |
          cat > hil_config.local.toml <<EOF
          [rig]
          lib_dir = "$HOME/ci-lib"
          pio = "$HOME/ci-pio/bin/pio"
          EOF
          ./builder/build.sh --boards "$BOARDS" --profiles "$PROFILES"

      - uses: actions/upload-artifact@v4
        with:
          name: hil-bundles
          path: bundles/
          retention-days: 7

  hil-test:
    needs: build
    runs-on: self-hosted     # only needs ssh + rsync; no hardware here
    steps:
      - name: Checkout harness            # the ref under test drives the tester too
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hil-bundles
          path: bundles/

      - name: Set up SSH to the tester
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.HIL_TESTER_SSH_KEY }}" > ~/.ssh/hil_tester
          chmod 600 ~/.ssh/hil_tester
          ssh-keyscan -H "${{ secrets.HIL_TESTER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Flash + test on the tester
        run: |
          T="${{ secrets.HIL_TESTER_USER }}@${{ secrets.HIL_TESTER_HOST }}"
          SSH="ssh -i ~/.ssh/hil_tester"
          # push this exact harness checkout (keep the tester's real serial-port config)
          rsync -a -e "$SSH" --delete \
            --exclude '.git' --exclude '.pio' --exclude 'bundles' --exclude 'results' \
            --exclude 'hil_config.local.toml' --exclude '__pycache__' --exclude '*.pyc' \
            ./ "$T:ESP32-BLE-Gamepad-HIL/"
          rsync -a -e "$SSH" --delete bundles/ "$T:hil-bundles/"
          $SSH "$T" 'set -e
            cd ~/ESP32-BLE-Gamepad-HIL
            rm -rf results && mkdir results
            rc=0
            for b in ~/hil-bundles/*/; do ./tester/test.sh "$b" --bench || rc=$?; done
            echo; cat results/run-verdicts.md || true
            exit $rc'
          rsync -a -e "$SSH" "$T:ESP32-BLE-Gamepad-HIL/results/" results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-results
          path: results/

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: HIL
          path: results/junit-*.xml
          reporter: java-junit
