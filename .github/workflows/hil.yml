# Build hil_runner firmware on a GitHub-hosted runner, then flash + run the BLE
# HID suite on the physical tester -- reached over an ephemeral Tailscale node
# the runner brings up for the job (no self-hosted runner, no inbound ports).
#
# Runs on push, on manual dispatch, on repository_dispatch (so the library repo
# can trigger it), and on a weekly schedule. `lib_ref` selects the
# ESP32-BLE-Gamepad ref under test.
#
# Two run modes (see tester/test-all.sh):
#   default  -- parallel functional matrix (--by-board), ~1 lane per board, ~15 min.
#               push / repository_dispatch / a plain dispatch use this.
#   --bench  -- the sequential latency/throughput sweep, solo, ~40 min. Only the
#               Monday schedule and a dispatch with `bench: true` run it; its
#               loose gates aren't worth blocking every push on.
#
# Required repo secrets:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   Tailscale OAuth client (scope:
#       "Auth Keys" write) tagged `tag:ci`. The ACL must let `tag:ci` reach the
#       tester on tcp:22.
#   HIL_TESTER_HOST      the tester's Tailscale MagicDNS name (e.g. hil-pi)
#   HIL_TESTER_USER      ssh user on the tester
#   HIL_TESTER_SSH_KEY   private key authorised on the tester (no passphrase)
#
# The tester has this repo cloned at ~/ESP32-BLE-Gamepad-HIL with
# hil_config.local.toml filled in (board ports), its ~/.venvs/hil from
# tester/requirements.txt, the udev rule, the ESP32(s) + a BLE adapter, and
# Tailscale up (tester/bootstrap-host.sh installs it). The hil-test job
# git-resets that checkout to the rig commit under test (preserving only the
# gitignored local config), so it never drifts. It only ever flashes prebuilt
# bundles -- no PlatformIO.

name: HIL

on:
  push:
    branches: [main, "hil-*"]
  schedule:
    # Mon 02:00 UTC = 04:00 SAST -- the weekly --bench sweep on main. ~40 min of
    # rig time plus build/queue; comfortably done before the workday. GitHub can
    # delay a cron run 30-60 min under load, which still lands well before 08:00.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      lib_repo:
        description: ESP32-BLE-Gamepad git URL (blank = repo var HIL_LIB_REPO, else LeeNX)
        default: ""
      lib_ref:
        description: library ref to test (blank = repo var HIL_LIB_REF, else master)
        default: ""
      boards:
        description: 'space-separated subset to build+test (blank = all: esp32dev esp32c3 esp32s3)'
        default: ""
      profiles:
        description: 'space-separated subset (blank = default specials maxbtn on push, + minimal on the weekly schedule)'
        default: ""
      test_filter:
        description: 'pytest -k expression for a focused run, e.g. "feature_report" or "battery or descriptor" (blank = whole suite)'
        default: ""
      bench:
        description: 'run the sequential --bench latency/throughput sweep (~40 min) instead of the parallel functional matrix'
        type: boolean
        default: false
  repository_dispatch:
    types: [hil]

concurrency:
  group: hil-rig          # one physical rig -- never run two at once
  cancel-in-progress: false

permissions:
  contents: read
  actions: read           # dorny/test-reporter lists run artifacts
  checks: write           # dorny/test-reporter creates the check run

env:
  # precedence: explicit dispatch input > repository_dispatch payload > repo
  # variable (HIL_LIB_REPO / HIL_LIB_REF -- a standing default while the HIL
  # changes live on a fork branch not yet merged upstream) > the built-in.
  LIB_REPO: ${{ inputs.lib_repo || github.event.client_payload.lib_repo || vars.HIL_LIB_REPO || 'https://github.com/LeeNX/ESP32-BLE-Gamepad.git' }}
  LIB_REF:  ${{ inputs.lib_ref  || github.event.client_payload.lib_ref  || vars.HIL_LIB_REF  || 'master' }}
  # Every push / PR builds 3 profiles: `default` (what most people run),
  # `specials` (the fragile surface -- special buttons + signed axes + Output/
  # Feature reports), `maxbtn` (the largest layout the HID transport supports).
  # `minimal` (the bench low-end anchor -- nothing else depends on it) joins them
  # only on the weekly `schedule`, which also runs --bench. A workflow_dispatch
  # can set any subset via `profiles`. The tester runs only the boards it has
  # wired (host/hil/detect.py -> tester/test.sh SKIPs the rest) -- esp32c3 /
  # esp32s3 ship with CHANGE-ME ports so they build here but skip on a tester
  # until real ports are set.
  BOARDS: ${{ inputs.boards || 'esp32dev esp32c3 esp32s3' }}
  PROFILES: ${{ inputs.profiles || (github.event_name == 'schedule' && 'default specials minimal maxbtn' || 'default specials maxbtn') }}
  TEST_FILTER: ${{ inputs.test_filter }}
  # The Monday schedule and an explicit `bench: true` dispatch run the sequential
  # latency/throughput sweep; every other trigger runs the parallel functional
  # matrix (--by-board). See tester/test-all.sh.
  HIL_MODE: ${{ (github.event_name == 'schedule' || inputs.bench == true) && '--bench' || '--by-board' }}

jobs:
  build:
    # This repo always; a fork only once it has a tester wired and its secrets
    # set (TS_OAUTH_*, HIL_TESTER_*) -- then set repo variable HIL_RIG_ENABLED=true.
    # Keeps a fresh fork's Actions tab clean (skipped) instead of failing on the
    # missing Tailscale secret.
    if: github.repository == 'LeeNX/ESP32-BLE-Gamepad-HIL' || vars.HIL_RIG_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v5

      - name: Checkout library under test
        run: |
          git clone --depth 1 --branch "$LIB_REF" "$LIB_REPO" "$HOME/ci-lib" \
            || git clone "$LIB_REPO" "$HOME/ci-lib"
          git -C "$HOME/ci-lib" checkout "$LIB_REF"
          git -C "$HOME/ci-lib" rev-parse --short HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build firmware bundles
        env:
          # Status LED GPIOs (docs/rig-hardware.md) -- repo Variables or
          # Secrets, either works (`||` skips an unset/empty one). Add one
          # line per board/LED as they get wired; unset -> that LED compiles
          # out for that board, no error.
          HIL_LED_PIN_ESP32DEV: ${{ vars.HIL_LED_PIN_ESP32DEV || secrets.HIL_LED_PIN_ESP32DEV || '' }}
        run: |
          cat > hil_config.local.toml <<EOF
          [rig]
          lib_dir = "$HOME/ci-lib"
          pio = "$(command -v pio)"
          EOF
          ./builder/build.sh --boards "$BOARDS" --profiles "$PROFILES"

      - uses: actions/upload-artifact@v6
        with:
          name: hil-bundles
          path: bundles/
          retention-days: 7

  hil-test:
    needs: build
    if: github.repository == 'LeeNX/ESP32-BLE-Gamepad-HIL' || vars.HIL_RIG_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness            # for the test-reporter source links
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: hil-bundles
          path: bundles/

      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH to the tester
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HIL_TESTER_SSH_KEY }}" > ~/.ssh/hil_tester
          chmod 600 ~/.ssh/hil_tester
          cat >> ~/.ssh/config <<EOF
          Host hil-tester
            HostName ${{ secrets.HIL_TESTER_HOST }}
            User ${{ secrets.HIL_TESTER_USER }}
            IdentityFile ~/.ssh/hil_tester
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF

      - name: Flash + test on the tester
        env:
          RIG_SHA: ${{ github.sha }}
          RIG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # bundles are build artifacts (not in git) -- push them to a *staging*
          # dir; test-all.sh swaps it into ~/hil-bundles under the rig lock. A
          # plain `rsync --delete` straight to ~/hil-bundles races a concurrent
          # local scripts/hil.sh doing the same before either holds the lock.
          rsync -a --delete bundles/ hil-tester:hil-bundles.ci/
          # the tester runs the exact rig commit under test: fetch + hard-reset
          # its own checkout to it (keeps only the gitignored local port config),
          # so the checkout stays coherent instead of drifting under an rsync.
          # RIG_SHA / RIG_RUN_URL / HIL_TEST_FILTER / HIL_MODE are prepended as
          # assignment lines (printf %q-quoted), so the remote body can stay a
          # literal heredoc. HIL_MODE is --by-board (parallel functional) or --bench.
          rc=0
          { printf 'RIG_SHA=%q RIG_RUN_URL=%q HIL_TEST_FILTER=%q HIL_MODE=%q\n' "$RIG_SHA" "$RIG_RUN_URL" "$TEST_FILTER" "$HIL_MODE"; cat <<'REMOTE'; } | ssh hil-tester bash -se || rc=$?
          cd ~/ESP32-BLE-Gamepad-HIL
          # one physical rig -- take the lock *before* touching the checkout, so a
          # concurrent local run isn't reset/cleaned out from under itself. Raw
          # flock here (not tester/rig-lock.sh): the git reset below may rewrite
          # that script. Waits ~45 min, then fails loudly with the holder.
          CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/esp32-hil"; mkdir -p "$CACHE"
          exec 9>"$CACHE/rig.lock"
          flock -w 2700 9 || {
            echo "::error::HIL rig is busy -- another run holds it:"
            cat "$CACHE/rig-status.json" 2>/dev/null || true
            exit 75
          }
          git fetch --quiet --prune origin
          git reset --quiet --hard "$RIG_SHA" \
            || { echo "::error::tester: rig commit $RIG_SHA not reachable from origin"; exit 1; }
          git clean --quiet -ffdx -e /hil_config.local.toml -e /.venv -e /.venvs
          rm -rf results && mkdir results
          # swap staged bundles in under the lock (test-all.sh also would, but do
          # it here too so it works when RIG_SHA predates that code)
          [ -d "$HOME/hil-bundles.ci" ] && { rm -rf "$HOME/hil-bundles"; mv "$HOME/hil-bundles.ci" "$HOME/hil-bundles"; }
          export HIL_RIG_LOCK_HELD=$$ HIL_RUN_PID=$$ HIL_RUN_WHO=CI HIL_RUN_URL="$RIG_RUN_URL"
          export HIL_TEST_FILTER HIL_BUNDLE_STAGE="$HOME/hil-bundles.ci"
          # --by-board landed in rig v0.2.0; if RIG_SHA predates it, fall back to
          # the sequential functional run rather than feeding pytest a bad arg.
          mode="$HIL_MODE"
          if [ "$mode" = "--by-board" ] && ! grep -q -- '--by-board' tester/test-all.sh; then
            echo "::warning::rig commit predates --by-board -- running sequential functional"
            mode=""
          fi
          export HIL_RUN_WHAT="flash+test ${mode:-(sequential)}${HIL_TEST_FILTER:+ -k '$HIL_TEST_FILTER'}"
          tester/rig-lock.sh --status-write busy || true
          trc=0
          tester/test-all.sh $mode || trc=$?
          tester/rig-lock.sh --status-write idle "$trc" || true
          echo; cat results/run-verdicts.md || true
          exit $trc
          REMOTE
          # always pull results back (even on a test failure) for the report + artifact
          rsync -a hil-tester:ESP32-BLE-Gamepad-HIL/results/ results/ || true
          exit $rc

      - name: Job summary
        if: always()
        run: |
          # post-only -- dorny/test-reporter below is the gate, so never fail here.
          # summarize.py exits 1 merely because tests failed (the summary still
          # renders fine); only a usage error (>=2) or a crash (traceback on
          # stderr) means the summary is actually missing or broken.
          if ls results/junit-*.xml >/dev/null 2>&1; then
            rc=0
            python3 host/hil/summarize.py results/junit-*.xml \
              >> "$GITHUB_STEP_SUMMARY" 2> "$RUNNER_TEMP/summarize.err" || rc=$?
            if [ "$rc" -ge 2 ] || [ -s "$RUNNER_TEMP/summarize.err" ]; then
              echo "::warning::summarize.py exited $rc -- job summary may be incomplete"
              {
                echo
                echo "> ⚠️ \`summarize.py\` exited $rc -- raw JUnit is in the \`hil-results\` artifact and the HIL check below."
                if [ -s "$RUNNER_TEMP/summarize.err" ]; then
                  echo '>'
                  echo '> ```'
                  sed 's/^/> /' "$RUNNER_TEMP/summarize.err"
                  echo '> ```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            { echo "## HIL"; echo; echo "No JUnit results — the tester step produced nothing (see the step log)."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hil-results
          path: results/

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: HIL
          path: results/junit-*.xml
          reporter: java-junit
