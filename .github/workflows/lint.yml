# Formatting + linting gate. Runs the same .pre-commit-config.yaml that
# contributors run locally, so `pre-commit run --all-files` passing on a
# laptop means this job passes too.
#
# Covers: ruff (Python lint + format), shfmt + shellcheck (shell),
# markdownlint-cli2 (docs), taplo (TOML), actionlint (workflows).

name: lint

on:
  push:
    branches: [main, "hil-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install actionlint
        run: |
          bash <(curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "$ACTIONLINT_VERSION" /usr/local/bin
          actionlint -version

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure --color always
