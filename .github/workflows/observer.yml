# Build the Bluepad32 observer firmware (firmware/observer): on its own whenever its sources change, so a break shows up
# on the push rather than at release time, and as a reusable workflow (workflow_call) that hil.yml and release.yml run
# in parallel with their hil_runner build -- the two builds share nothing. Builds only -- the observer matrix runs on
# the rig (tester/test-matrix.sh). The bundles are uploaded as the `observer-bundles` artifact, flashable as-is.
name: Observer firmware

on:
  push:
    paths:
      - firmware/observer/**
      - builder/build-observers.sh
      - builder/led-pin.sh
      - builder/fetch-bluepad32.sh
      - builder/make_bundle.py
      - hil_config.toml
      - .github/workflows/observer.yml
  pull_request:
    paths:
      - firmware/observer/**
      - builder/build-observers.sh
      - builder/led-pin.sh
      - builder/fetch-bluepad32.sh
      - builder/make_bundle.py
      - hil_config.toml
      - .github/workflows/observer.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      boards:
        description: space-separated boards to build observers for
        type: string
        default: esp32dev esp32c3 esp32s3
      ref:
        description: ref to build (blank = the caller's; release.yml passes its tag, which a manual re-run names)
        type: string
        default: ""
      status_leds:
        description: >-
          bake in the rig's status-LED GPIOs (HIL_LED_PIN_<BOARD> / HIL_CONN_LED_PIN_<BOARD> repo Variables or
          Secrets; the caller passes `secrets: inherit` for the latter). hil.yml sets it; release builds stay LED-free
          like the release hil_runner bundles
        type: boolean
        default: false

env:
  BOARDS: ${{ inputs.boards || 'esp32dev esp32c3 esp32s3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # make_bundle.py records `git describe` as rig_describe

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-observer-${{ runner.os }}-${{ hashFiles('firmware/observer/platformio.ini') }}

      - name: Bluepad32 ref
        id: bp32
        run: echo "ref=$(python3 host/hil/config.py observer.bluepad32_ref)" >> "$GITHUB_OUTPUT"

      - name: Cache Bluepad32
        uses: actions/cache@v5
        with:
          path: .cache/bluepad32
          key: bluepad32-${{ steps.bp32.outputs.ref }}

      - name: Build the observer bundles
        env:
          # Status LEDs (docs/rig-hardware.md "Observer firmware"): the same per-board settings as hil.yml's hil_runner
          # build, only when the caller asks (status_leds). Empty -> that LED compiles out.
          HIL_LED_PIN_ESP32DEV: ${{ inputs.status_leds && (vars.HIL_LED_PIN_ESP32DEV || secrets.HIL_LED_PIN_ESP32DEV) || '' }}
          HIL_LED_PIN_ESP32DEV2: ${{ inputs.status_leds && (vars.HIL_LED_PIN_ESP32DEV2 || secrets.HIL_LED_PIN_ESP32DEV2) || '' }}
          HIL_LED_PIN_ESP32C3: ${{ inputs.status_leds && (vars.HIL_LED_PIN_ESP32C3 || secrets.HIL_LED_PIN_ESP32C3) || '' }}
          HIL_LED_PIN_ESP32S3: ${{ inputs.status_leds && (vars.HIL_LED_PIN_ESP32S3 || secrets.HIL_LED_PIN_ESP32S3) || '' }}
          HIL_CONN_LED_PIN_ESP32DEV: ${{ inputs.status_leds && (vars.HIL_CONN_LED_PIN_ESP32DEV || secrets.HIL_CONN_LED_PIN_ESP32DEV) || '' }}
          HIL_CONN_LED_PIN_ESP32DEV2: ${{ inputs.status_leds && (vars.HIL_CONN_LED_PIN_ESP32DEV2 || secrets.HIL_CONN_LED_PIN_ESP32DEV2) || '' }}
          HIL_CONN_LED_PIN_ESP32C3: ${{ inputs.status_leds && (vars.HIL_CONN_LED_PIN_ESP32C3 || secrets.HIL_CONN_LED_PIN_ESP32C3) || '' }}
          HIL_CONN_LED_PIN_ESP32S3: ${{ inputs.status_leds && (vars.HIL_CONN_LED_PIN_ESP32S3 || secrets.HIL_CONN_LED_PIN_ESP32S3) || '' }}
        run: ./builder/build-observers.sh --boards "$BOARDS"

      - uses: actions/upload-artifact@v6
        with:
          name: observer-bundles
          path: bundles/matrix/
