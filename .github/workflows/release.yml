# Tag push (vX.Y.Z) -> build the full firmware matrix against the library, bundle
# it with the standalone suite, and publish a GitHub Release. See RELEASE.md.
#
# scripts/release.sh creates the tag locally; this runs after it's pushed.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: existing vX.Y.Z tag to (re)build the release for
        required: true
      lib_ref:
        description: library ref to build against (blank = repo var HIL_LIB_REF, else master)
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write          # create the release, upload assets

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # repo variables HIL_LIB_REPO / HIL_LIB_REF are the standing default while the
  # library-side HIL changes (the report-descriptor getters hil_runner needs)
  # live on a fork branch not yet on master. Drop the var once merged.
  LIB_REPO: ${{ vars.HIL_LIB_REPO || 'https://github.com/LeeNX/ESP32-BLE-Gamepad.git' }}
  LIB_REF: ${{ inputs.lib_ref || vars.HIL_LIB_REF || 'master' }}
  BOARDS: esp32dev esp32c3 esp32s3
  # The release ships every profile. Everyday pushes build 3 (minimal and maxfeat
  # join on the weekly schedule); the pre-tag full-matrix hil.yml dispatch
  # (RELEASE.md) tests them on hardware. sinput bundles land under matrix/: the
  # observer matrix (tester/test-matrix.sh) tests them, not test-all.sh.
  PROFILES: default specials minimal maxbtn maxfeat sinput

jobs:
  # Two builds in parallel -- they share nothing -- then `release` assembles and publishes:
  #   firmware   the hil_runner matrix (every board x profile) against the library
  #   observers  the Bluepad32 observer firmware (firmware/observer, against the Bluepad32 pinned in hil_config.toml),
  #              via observer.yml, from the release tag. Same boards as BOARDS (`with:` can't read env).
  observers:
    if: github.repository == 'LeeNX/ESP32-BLE-Gamepad-HIL' || vars.HIL_RIG_ENABLED == 'true'
    uses: ./.github/workflows/observer.yml
    with:
      boards: esp32dev esp32c3 esp32s3
      ref: ${{ inputs.tag || github.ref_name }}

  firmware:
    if: github.repository == 'LeeNX/ESP32-BLE-Gamepad-HIL' || vars.HIL_RIG_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      lib_sha: ${{ steps.lib.outputs.sha }}
      lib_describe: ${{ steps.lib.outputs.describe }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0  # make_bundle.py records `git describe` as each manifest's rig_describe

      - name: Verify VERSION matches the tag
        # here too, so a mismatched tag fails before the long build
        run: |
          want="${TAG#v}"
          have="$(cat VERSION)"
          echo "tag=$TAG  VERSION file=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::VERSION ($have) != tag $TAG. Bump VERSION, commit, re-tag."
            exit 1
          fi
          case "$want" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Checkout the library
        id: lib
        run: |
          git clone --depth 1 --branch "$LIB_REF" "$LIB_REPO" "$HOME/lib" \
            || git clone "$LIB_REPO" "$HOME/lib"
          git -C "$HOME/lib" checkout "$LIB_REF"
          {
            echo "sha=$(git -C "$HOME/lib" rev-parse HEAD)"
            echo "describe=$(git -C "$HOME/lib" describe --tags --always)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the firmware matrix
        run: |
          cat > hil_config.local.toml <<EOF
          [rig]
          lib_dir = "$HOME/lib"
          pio = "$(command -v pio)"
          EOF
          ./builder/build.sh --boards "$BOARDS" --profiles "$PROFILES"

      - uses: actions/upload-artifact@v6
        with:
          name: firmware-bundles
          path: bundles/

  release:
    needs: [firmware, observers]
    if: github.repository == 'LeeNX/ESP32-BLE-Gamepad-HIL' || vars.HIL_RIG_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify VERSION matches the tag
        id: v
        run: |
          want="${TAG#v}"
          have="$(cat VERSION)"
          echo "tag=$TAG  VERSION file=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::VERSION ($have) != tag $TAG. Bump VERSION, commit, re-tag."
            exit 1
          fi
          case "$want" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fetch the firmware bundles
        uses: actions/download-artifact@v7
        with:
          name: firmware-bundles
          path: bundles/

      # They ship in the firmware tarball, under firmware-bundles/matrix/.
      - name: Fetch the observer bundles
        uses: actions/download-artifact@v7
        with:
          name: observer-bundles
          path: bundles/matrix/

      - name: Assemble release artifacts
        env:
          # the library the firmware job built against (make-release-artifacts.sh reads these for index.json)
          LIB_SHA: ${{ needs.firmware.outputs.lib_sha }}
          LIB_DESCRIBE: ${{ needs.firmware.outputs.lib_describe }}
        run: scripts/make-release-artifacts.sh "$TAG"

      - name: Assemble bench notes
        id: bench
        run: |
          if [ -s docs/bench/bench-table.md ]; then
            base="https://raw.githubusercontent.com/${{ github.repository }}/$TAG/docs/bench"
            {
              echo "## HIL benchmark"
              echo
              echo "Latency/throughput snapshot from the rig's \`--bench\` sweep (button e2e, polling rate, connection interval)." \
                   "Full commentary in [\`docs/bench/\`](https://github.com/${{ github.repository }}/tree/$TAG/docs/bench)."
              echo
              tail -n +2 docs/bench/bench-table.md  # drop its own "# HIL benchmark" H1, we have our own
              echo
              # host/hil/charts.py writes each SVG independently of bench-table.md
              # (main() skips a chart with no data for it -- `if svg:` before the
              # write), so a valid table can coexist with one missing SVG. Link
              # only the ones that actually exist, or a snapshot missing just one
              # chart would publish a broken image link instead of the other two
              # charts still rendering.
              [ -s docs/bench/latency-distribution.svg ] && echo "![button latency distribution]($base/latency-distribution.svg)"
              [ -s docs/bench/latency-vs-reportsize.svg ] && echo "![latency vs report size]($base/latency-vs-reportsize.svg)"
              [ -s docs/bench/polling-rate.svg ] && echo "![polling rate]($base/polling-rate.svg)"
              echo
            } > dist/bench-notes.md
            echo "has_bench=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no docs/bench/bench-table.md -- release notes will skip the bench section"
            echo "has_bench=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          [ "${{ steps.v.outputs.prerelease }}" = "true" ] && flag="--prerelease"
          notes_flag=()
          [ "${{ steps.bench.outputs.has_bench }}" = "true" ] && notes_flag=(--notes-file dist/bench-notes.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "$TAG" --generate-notes $flag \
              "${notes_flag[@]}" dist/*.tar.gz dist/SHA256SUMS
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-dist
          path: dist/
