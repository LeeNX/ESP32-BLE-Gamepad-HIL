# Gitea Actions: build hil_runner firmware on any runner, then flash + run the
# BLE HID suite on the Raspberry Pi tester over SSH.
#
# Runs when this harness repo is pushed, on manual dispatch, and on
# repository_dispatch (so the library repo can trigger it -- see README
# "Gitea CI"). `lib_ref` selects the ESP32-BLE-Gamepad ref under test.
#
# Required repo secrets:
#   HIL_PI_HOST      hostname/IP of the Pi tester
#   HIL_PI_USER      ssh user on the Pi
#   HIL_PI_SSH_KEY   private key authorised on the Pi (no passphrase)
#
# The Pi must already have the harness checked out at ~/esp32-ble-gamepad-hil
# with hil_config.local.toml filled in, its ~/.venvs/hil built from
# tester/requirements.txt, the udev rule, and the ESP32 + BLE adapter attached.

name: HIL

on:
  push:
    branches: [master, "hil-*"]
  workflow_dispatch:
    inputs:
      lib_repo:
        description: ESP32-BLE-Gamepad git URL
        default: https://github.com/LeeNX/ESP32-BLE-Gamepad.git
      lib_ref:
        description: library ref to test
        default: master
  repository_dispatch:
    types: [hil]

concurrency:
  group: hil-pi          # one physical rig -- never run two at once
  cancel-in-progress: false

env:
  LIB_REPO: ${{ inputs.lib_repo || github.event.client_payload.lib_repo || 'https://github.com/LeeNX/ESP32-BLE-Gamepad.git' }}
  LIB_REF:  ${{ inputs.lib_ref  || github.event.client_payload.lib_ref  || 'master' }}
  BOARDS: esp32dev
  PROFILES: default specials

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout library under test
        run: |
          git clone --depth 1 --branch "$LIB_REF" "$LIB_REPO" "$HOME/ci-lib" \
            || git clone "$LIB_REPO" "$HOME/ci-lib"
          git -C "$HOME/ci-lib" checkout "$LIB_REF"
          git -C "$HOME/ci-lib" rev-parse --short HEAD

      - name: Install PlatformIO
        run: |
          python3 -m venv "$HOME/ci-pio"
          "$HOME/ci-pio/bin/pip" -q install platformio

      - name: Build firmware bundles
        run: |
          cat > hil_config.local.toml <<EOF
          [rig]
          lib_dir = "$HOME/ci-lib"
          pio = "$HOME/ci-pio/bin/pio"
          EOF
          ./builder/build.sh --boards "$BOARDS" --profiles "$PROFILES"

      - uses: actions/upload-artifact@v4
        with:
          name: hil-bundles
          path: bundles/
          retention-days: 7

  hil-test:
    needs: build
    runs-on: self-hosted     # only needs ssh + rsync; no hardware here
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hil-bundles
          path: bundles/

      - name: Set up SSH to the Pi
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.HIL_PI_SSH_KEY }}" > ~/.ssh/hil_pi
          chmod 600 ~/.ssh/hil_pi
          ssh-keyscan -H "${{ secrets.HIL_PI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Flash + test on the Pi
        run: |
          PI="${{ secrets.HIL_PI_USER }}@${{ secrets.HIL_PI_HOST }}"
          SSH="ssh -i ~/.ssh/hil_pi"
          rsync -a -e "$SSH" --delete bundles/ "$PI:hil-bundles/"
          $SSH "$PI" 'set -e
            cd ~/esp32-ble-gamepad-hil
            git pull --ff-only --quiet || true
            rm -rf results && mkdir results
            rc=0
            for b in ~/hil-bundles/*/; do ./tester/test.sh "$b" || rc=$?; done
            exit $rc'
          rsync -a -e "$SSH" "$PI:esp32-ble-gamepad-hil/results/" results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-results
          path: results/

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: HIL
          path: results/junit-*.xml
          reporter: java-junit
