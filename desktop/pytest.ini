[pytest]
testpaths = tests
# "." for this dir, "../host" for the shared hil package (SerialDev, hidraw).
pythonpath = . ../host
# Pass path-valued options with '=' (--bundle=../x, not --bundle ../x): a bare
# path arg outside this dir makes pytest walk up loading conftest.py and it
# hits the Linux-only ../conftest.py (fails on `evdev`). The README uses '='.
addopts = -ra
console_output_style = count
markers =
    serial_only: needs only pyserial + a flashed board -- no BLE, no host HID stack (runs on macOS / Windows)
    hid: reads raw HID input reports (hidapi) -- needs the board bonded to this host (pair-assist.py)
