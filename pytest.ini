[pytest]
testpaths = host/tests
pythonpath = host
# -s: don't capture stdout -- conftest.py's session fixtures (firmware upload,
# dut, bt_mac, gamepad) print progress ("[bt] ... -> mac") as they go, and captured
# output only surfaces at the end, so without -s a slow step (pairing ~20s, a
# flash retry, BLE reconnect) looks like a hang instead of showing what it's doing.
# -v: one line per test as it finishes, so a long run doesn't sit silent either.
addopts = -ra -s -v
console_output_style = count
