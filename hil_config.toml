# HIL rig config. This file is the committed template; put per-machine values
# (serial ports, ssh hosts, paths) in hil_config.local.toml, which is gitignored
# and deep-merged over this one. Env vars still win: HIL_PORT / HIL_BOARD /
# HIL_PROFILE / HIL_BOARDS / HIL_PROFILES / HIL_BUNDLE.

[rig]
lib_dir = "~/src/ESP32-BLE-Gamepad"   # library checkout the builder compiles against
device_name = "HILpad"                # firmware advertises "<device_name> <board>"
pio = "pio"                           # or an absolute path, e.g. ~/.venvs/pio/bin/pio

# BUILDER role -- what builder/build.sh compiles by default. Profiles:
# default | signed-axes | specials | minimal | maxbtn | reports
# (see firmware/include/hil_profile.h)
[builder]
boards = "esp32dev esp32c3 esp32s3"                                # space separated
profiles = "default signed-axes specials minimal maxbtn reports"  # space separated

# TESTER role -- the Raspberry Pi + ESP32(s) + BLE adapter. builder/build.sh
# --push rsyncs bundles here; the library repo's scripts/hil.sh and the CI job
# drive it over SSH. Never builds -- esptool flash only. Set the real host/user
# in hil_config.local.toml (or pass HIL_SSH_HOST / HIL_SSH_USER).
[tester]
ssh_host = ""                       # e.g. "hil-pi.lan" or a Tailscale name; empty = no push
ssh_user = ""                       # e.g. "hil"
bundle_dir = "~/hil-bundles"

[board.esp32dev]
pio_env = "esp32dev"
# A CP2102 / CP210x / CH340 USB-UART bridge. Override per machine in .local
# (ls -l /dev/serial/by-id/).
port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"

[board.esp32c3]
pio_env = "esp32c3"
# Built in CI but not flashed/tested until its UART bridge is wired on a tester.
# Set enabled = true (or drop this line) in hil_config.local.toml once ready;
# tester/test.sh SKIPs a disabled/absent board instead of failing.
enabled = false
# `port` is the hil_runner command channel; `flash_port` (optional, defaults to
# `port`) is where esptool/pio upload. On a C3 SuperMini they are different
# interfaces: hil_runner's Serial is UART0 (ARDUINO_USB_CDC_ON_BOOT=0), not the
# USB-C port, so wire a 3V3 USB-UART bridge to GPIO21/20 for `port` and keep the
# native USB-Serial/JTAG for `flash_port`. See README "ESP32-C3 serial bridge".
port = "/dev/serial/by-id/CHANGE-ME"
# flash_port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"

[board.esp32s3]
pio_env = "esp32s3"
# A dual-USB-C board (e.g. ESP32-S3-DevKitC-1): the onboard CP2102 bridge on
# the "UART" port *is* `port` (hil_runner's Serial -- UART0, same
# ARDUINO_USB_CDC_ON_BOOT=0 story as the C3) -- no external wiring needed. The
# "USB" port (native USB-OTG) is `flash_port`. See README "ESP32-S3 dual-USB-C".
port = "/dev/serial/by-id/CHANGE-ME"
# flash_port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"
