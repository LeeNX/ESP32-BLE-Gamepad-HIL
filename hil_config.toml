# HIL rig config. This file is the committed template; put per-machine values
# (serial ports, ssh hosts, paths) in hil_config.local.toml, which is gitignored
# and deep-merged over this one. Env vars still win: HIL_PORT / HIL_BOARD /
# HIL_PROFILE / HIL_BOARDS / HIL_PROFILES / HIL_BUNDLE.

[rig]
lib_dir = "~/src/ESP32-BLE-Gamepad"   # library checkout the builder compiles against
device_name = "HILpad"                # firmware advertises "<device_name> <board>"
health_iface = "eth0"                 # hil.usbhealth: must have carrier if present ("" = skip)
health_dwc_burst = 12                 # hil.usbhealth: this many new dwc_otg timeouts since baseline = unhealthy
pio = "pio"                           # or an absolute path, e.g. ~/.venvs/pio/bin/pio
# local_device_name -- override the advertised BLE name for `--profiles local`
# builds on THIS box (<= 18 chars), so a dev board doesn't collide with the rig
# or another dev. Put it in hil_config.local.toml. $HIL_DEVICE_NAME / --name win.
# local_device_name = "HILdev <you>"

# BUILDER role -- what builder/build.sh compiles by default. Profiles:
# default | specials | minimal | maxbtn  (see firmware/include/hil_profile.h)
#
#   default   -- 64 btn / 4 hat / 8 unsigned axes; what most people run, the
#                known-good baseline (mirrors TestAll.ino).
#   specials  -- the fragile, least-exercised surface in one flash: 8 special
#                (consumer/desktop) usages + signed axes + Output/Feature reports.
#   maxbtn    -- the largest layout the HID transport currently supports (the
#                library's 128-button ceiling).
#   minimal   -- 2 btn / X-Y, smallest report; the latency-curve low-end anchor
#                and nothing else, so it is NOT in this default set -- it runs on
#                the weekly CI schedule and at release. Add it back with
#                --profiles "default specials minimal maxbtn" when you want it.
#   maxfeat   -- max features rather than buttons (16 btn, 1 hat, 6 axes, accel +
#                brake, home + back): what Bluepad32 maps from a generic gamepad.
#                Weekly CI schedule and release, like minimal.
#   sinput    -- GamepadMode::SInput (2E8A:10C6, IMU + RGB). Its bundles go under
#                bundles/matrix/, which test-all.sh skips: tester/sinput_hil.py
#                and tester/test-matrix.sh test it. Release only.
#
# `local` is an ad-hoc developer profile -- build it explicitly
# (HIL_PROFILES=local builder/build.sh), never list it here; CI and releases
# must not ship it.
[builder]
boards = "esp32dev esp32c3 esp32s3"    # space separated
profiles = "default specials maxbtn"  # see note above

# OBSERVER builds -- builder/build-observers.sh: Bluepad32 "observer" bundles (bundles/matrix/<board>-bp32obs-*)
# for the SInput / observer matrix, from firmware/observer. Set the paths in hil_config.local.toml (or
# $HIL_BLUEPAD32_DIR / $HIL_OBSERVER_PIO). Boards default to [builder].boards.
[observer]
bluepad32_dir = ""   # your own Bluepad32 checkout; blank = builder/fetch-bluepad32.sh's, at the pin below
# The pinned Bluepad32 source (CI and blank bluepad32_dir build this): upstream release 5.0.0-beta0, the first with
# the SInput parser (#234). Pinned by commit, as tags can move; its src/ is identical to LeeNX/bluepad32 6f603c7, which
# the observer matrix was verified with. Bump the ref deliberately, then re-run the matrix.
bluepad32_repo = "https://github.com/ricardoquesada/bluepad32.git"
bluepad32_ref = "80d6314e46f871719fbb4b721a2cc02227c4f369"   # tag 5.0.0-beta0
pio = ""             # PlatformIO >= 6.2 (pioarduino platform); blank = [rig].pio

# OBSERVER MATRIX -- tester/test-matrix.sh. Its boards (3 or more; each rotation uses three and leaves the rest
# idle), separate from [builder].boards so a board can join the matrix without joining CI.
[matrix]
boards = "esp32dev esp32c3 esp32s3"   # e.g. add "esp32dev2" in hil_config.local.toml

# TESTER role -- the Raspberry Pi + ESP32(s) + BLE adapter. builder/build.sh
# --push rsyncs bundles here; the library repo's scripts/hil.sh and the CI job
# drive it over SSH. Never builds -- esptool flash only. Set the real host/user
# in hil_config.local.toml (or pass HIL_SSH_HOST / HIL_SSH_USER).
[tester]
ssh_host = ""                       # e.g. "hil-pi.lan" or a Tailscale name; empty = no push
ssh_user = ""                       # e.g. "hil"
bundle_dir = "~/hil-bundles"

[board.esp32dev]
pio_env = "esp32dev"
# A CP2102 / CP210x / CH340 USB-UART bridge. Override per machine in .local
# (ls -l /dev/serial/by-id/).
port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"
# Status LEDs (docs/rig-hardware.md, README "Serial protocol" / "Rig hardware
# TODO"): the GPIOs an LED+resistor is wired to on THIS box's board, once
# wired -- builder/build.sh passes them as -D HIL_LED_PIN=<n> / -D
# HIL_CONN_LED_PIN=<n>. `$HIL_LED_PIN_ESP32DEV` / `$HIL_CONN_LED_PIN_ESP32DEV`
# override without editing config (handy from a CI runner). Unset/absent ->
# that LED's code compiles out to a no-op; TEMP? is unaffected either way.
# led_pin = <gpio>          # pulses on every serial command; LED ON/OFF override
# conn_led_pin = <gpio>     # steady on while BLE-connected; no override, state-driven
# Most esp32dev-style boards already have an onboard LED on GPIO2 -- check
# yours, then just `led_pin = 2` with nothing to wire. See docs/rig-hardware.md.

[board.esp32c3]
pio_env = "esp32c3"
# `port` is the hil_runner command channel; `flash_port` (optional, defaults to
# `port`) is where esptool/pio upload. On a C3 they are different interfaces:
# hil_runner's Serial is UART0 (ARDUINO_USB_CDC_ON_BOOT=0), not the USB-C port,
# so wire a 3V3 USB-UART bridge to GPIO21/20 for `port` and keep the native
# USB-Serial/JTAG for `flash_port`. See README "ESP32-C3 serial bridge".
# (Set `enabled = false` here or in .local to build it in CI but skip flash/test.)
port = "/dev/serial/by-id/CHANGE-ME"
# flash_port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"
# Status LEDs -- see board.esp32dev above. Overrides: $HIL_LED_PIN_ESP32C3 /
# $HIL_CONN_LED_PIN_ESP32C3. GPIO8/9 are boot-strap pins on the C3 and
# GPIO20/21 are UART0 (hil_runner's Serial) -- avoid all four.
# led_pin = <gpio>
# conn_led_pin = <gpio>

[board.esp32s3]
pio_env = "esp32s3"
# A dual-USB-C board (e.g. ESP32-S3-DevKitC-1): the onboard CP2102 bridge on
# the "UART" port *is* `port` (hil_runner's Serial -- UART0, same
# ARDUINO_USB_CDC_ON_BOOT=0 story as the C3) -- no external wiring needed, and
# it has the auto-reset circuit, so leave flash_port unset to flash through it
# too. Flashing over the "USB" port (native USB-OTG) via flash_port works, but
# on a Pi 3B+ it caused bursts of dwc_otg timeouts (the USB+Ethernet wedge) --
# see README "ESP32-S3 dual-USB-C".
port = "/dev/serial/by-id/CHANGE-ME"
# flash_port = "/dev/serial/by-id/CHANGE-ME"   # native "USB" port; see above
profile = "default"
# Status LEDs -- see board.esp32dev above. Overrides: $HIL_LED_PIN_ESP32S3 /
# $HIL_CONN_LED_PIN_ESP32S3.
# led_pin = <gpio>
# conn_led_pin = <gpio>

[board.esp32dev2]
# A second classic ESP32 DevKit (the rig's original esp32dev, onboard CP2102 with
# the auto-reset circuit). Observer matrix only: add it to [matrix].boards, not
# [builder].boards. Same chip as esp32dev; its own firmware name, so it
# advertises "HILpad esp32dev2".
pio_env = "esp32dev2"
port = "/dev/serial/by-id/CHANGE-ME"
profile = "default"
